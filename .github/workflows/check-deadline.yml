name: Super 6 deadline check

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Check deadline and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scraper.py

      - name: Upload debug file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadline-debug
          path: deadline_debug.txt
          if-no-files-found: ignore

      - name: Save state back to the repo
        if: always()
        run: |
          git config user.name "super6-bot"
          git config user.email "actions@github.com"
          git add state.json deadline_debug.txt
          git diff --quiet --cached || git commit -m "Update deadline state [skip ci]"
          git push
